<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan Buku Digital</title>
    <link rel="stylesheet" href="buku.css">
    <link rel="icon" type="image/x-icon" href="favicon.png">
</head>
<body class="halaman-baca">

    <div class="di-mana-abdul">
        <h1 class="judul-text">Perpustakaan Buku Digital</h1>
    </div>

    <div class="menu-kontainer">
        <a href="index.html" class="btn">Halaman Utama</a>
        <a href="artikel.html" class="btn">Baca Artikel</a>
        <a href="tentang-kami.html" class="btn">Tentang Kami</a>
    </div>

    <div class="daftar-buku">
        <!-- Buku 1: Kisah Wowo -->
        <a href="#modal-pilihan" class="card-link" onclick="pilihBuku('wowo')">
            <div class="card-buku">
                <img src="sianakbadai.jpg" class="foto-buku">
                <p>Si Anak Badai</p>
                <div class="btn-baca-sekarang">Baca Sekarang</div>
            </div>
        </a>

        <!-- Buku Laskar Pelangi -->
        <a href="#modal-pilihan" class="card-link" onclick="pilihBuku('laskar')">
            <div class="card-buku">
                <img src="laskar_pelangi.jpg" class="foto-buku">
                <p>Laskar Pelangi</p>
                <div class="btn-baca-sekarang">Baca Sekarang</div>
            </div>
        </a>

        <!-- Buku Krisis Kebebasan-->
        <a href="#modal-pilihan" class="card-link" onclick="pilihBuku('krisiskebebasan')">
            <div class="card-buku">
                <img src="krisiskebebasan.jpg" class="foto-buku">
                <p>Krisis Kebebasan</p>
                <div class="btn-baca-sekarang">Baca Sekarang</div>
            </div>
        </a>

         <!-- Buku  Dunia Shopie -->
        <a href="#modal-pilihan" class="card-link" onclick="pilihBuku('duniashopie')">
            <div class="card-buku">
                <img src="duniashopie.jpg" class="foto-buku">
                <p>Dunia Sophie</p>
                <div class="btn-baca-sekarang">Baca Sekarang</div>
            </div>
        </a>

    </div>

    <!-- POP-UP MODAL PILIHAN (BACA / DOWNLOAD) -->
    <div id="modal-pilihan" class="modal-overlay">
        <div class="konten-baca" style="text-align: center; background: #1e1e1e; color: white;">
            <a href="#close" class="tombol-tutup" onclick="event.preventDefault(); history.replaceState('', document.title, window.location.pathname); window.location.hash = 'close';">[X]</a>
            <h2 id="modal-judul-buku" style="margin-bottom: 15px;">Memuat Judul...</h2>
            <hr style="border: 0; border-top: 1px solid #444; margin-bottom: 20px;">
            
            <div style="display: flex; flex-direction: column; gap: 12px; max-width: 300px; margin: 0 auto;">
                <!-- Tombol Baca langsung buka PDF asli di tab baru -->
                <a id="modal-link-baca" href="" target="_blank" class="btn" style="background: #2563eb; border-color: #2563eb;">📖 Mulai Membaca (PDF)</a>
                <!-- Tombol unduh file PDF -->
                <a id="modal-link-download" href="" download class="btn" style="background: #10b981; border-color: #10b981;">📥 Download File PDF</a>
            </div>
        </div>
    </div>

    <!-- Hubungkan ke file database buku.js -->
    <script src="buku.js"></script>
    <script>
    function pilihBuku(idBuku) {
    // Ambil data dari buku.js secara dinamis berdasarkan parameter idBuku
    const buku = daftarBukuDigital[idBuku]; 
    
    if (buku) {
        document.getElementById('modal-judul-buku').innerText = buku.judul;
        document.getElementById('modal-link-baca').href = buku.linkPdf;
        document.getElementById('modal-link-download').href = buku.linkPdf;
    }
}

    </script>

</body>
</html>
